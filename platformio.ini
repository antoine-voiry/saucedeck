; SAUCEDECK — ESP32-S3-Zero macro deck (USB HID)
; pioarduino = community-maintained espressif32 platform with Arduino core 3.x

[platformio]
default_envs = saucedeck

; Shared ESP32-S3-Zero config
[esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; Waveshare ESP32-S3-Zero: ESP32-S3FH4R2 (4MB flash, 2MB QSPI PSRAM)
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi

; Native USB in OTG/TinyUSB mode (required for HID).
; USB_MODE=0 -> TinyUSB, CDC_ON_BOOT=1 -> Serial goes over the same USB port.
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed = 921600
test_ignore = native/*

; Production firmware
[env:saucedeck]
extends = esp32s3
build_src_filter = +<*> -<bringup/>

; Guided wiring test firmware (serial monitor driven)
[env:bringup]
extends = esp32s3
build_src_filter = +<bringup/>

; Host-side unit tests for hardware-free logic in lib/deck_core
[env:native]
platform = native
test_framework = unity
test_filter = native/*
build_flags = -std=gnu++17 -Wall -Wextra
