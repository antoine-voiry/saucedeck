; SAUCEDECK — ESP32-S3 SuperMini macro deck (USB HID)
; pioarduino = community-maintained espressif32 platform with Arduino core 3.x

[platformio]
default_envs = saucedeck

; Shared ESP32-S3 SuperMini config
[esp32s3]
; Pinned release (supply chain): bench-verified 2026-10-18. Upgrade = own change + bring-up rerun.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; ESP32-S3 SuperMini = ESP32-S3FH4R2 (4MB flash, 2MB QSPI PSRAM), esptool-verified 2026-10-22
board_upload.flash_size = 4MB
; huge_app: one 3 MB app slot (Wi-Fi stack no longer fits 1.25 MB), no OTA. NVS unchanged at 0x9000.
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_qspi

; Native USB in OTG/TinyUSB mode (required for HID).
; USB_MODE=0 -> TinyUSB, CDC_ON_BOOT=1 -> Serial goes over the same USB port.
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1

; USB strings must be compile-time: CDC_ON_BOOT=1 makes the core call USB.begin() before
; setup(), so USB.productName() in setup() is ignored (core USB.cpp productName: !_started).
build_flags =
    '-DUSB_PRODUCT="SAUCEDECK"'
    '-DUSB_MANUFACTURER="SAUCEDECK"'

; Warnings on our sources only (build_flags would also hit the framework).
; No -Wextra: TinyUSB tusb_types.h:557 (framework header) trips it. deck_core gets
; -Wall -Wextra -Werror in env:native.
build_src_flags = -Wall

monitor_speed = 115200
upload_speed = 921600
; TinyUSB CDC: open port at 1200 baud -> board reboots into ROM download mode
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
; Only native-USB S3 ports; never auto-pick a USB-UART board (e.g. CH9102 ESP32 on same desk)
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
test_ignore = native/*

; Production firmware
[env:saucedeck]
extends = esp32s3
build_src_filter = +<*> -<bringup/> -<spike_wifi/> -<spike_hid/>
; Exact versions (supply chain). Bump by hand, rerun bench.
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit NeoPixel@1.15.5
    tzapu/WiFiManager@2.0.17
    ; transitive dep of the ST7789 lib, pinned too. seesaw also pulls arduino-libraries/SD:
    ; downloaded but never linked (pinning it forces it into the build, and it rejects ESP32-S3)
    adafruit/Adafruit seesaw Library@1.7.9

; Guided wiring test firmware (serial monitor driven)
[env:bringup]
extends = esp32s3
build_src_filter = +<bringup/>

; Host-side unit tests for hardware-free logic in lib/deck_core
[env:native]
platform = native
test_framework = unity
test_filter = native/*
test_ignore = native/test_sim_*
build_flags = -std=gnu++17 -Wall -Wextra -Werror
; Static analysis (CI): our code only
check_tool = cppcheck
check_src_filters = +<lib/deck_core/src/> +<src/> +<include/>
check_skip_packages = yes
; unusedFunction = false positive: setup/loop and cross-file calls
check_flags = cppcheck: --suppress=unusedFunction

; native + gcov instrumentation, used by tools/coverage.sh
[env:native_cov]
extends = env:native
build_flags = ${env:native.build_flags} --coverage
extra_scripts = tools/coverage_flags.py

; Throwaway spike: WiFiManager + custom params on core 3.x (plan Task 1)
[env:spike_wifi]
extends = esp32s3
build_src_filter = +<spike_wifi/>
lib_deps =
    tzapu/WiFiManager@2.0.17

; Throwaway spike: vendor HID echo (plan Task 2)
[env:spike_hid]
extends = esp32s3
build_src_filter = +<spike_hid/>
